question:
  model: openai/gpt-4.1-mini
  messages:
    - role: user
      content: |
        Simulate a realistic multi-turn legal consultation between Steven and a legal expert named Jame.
        Steven is the main character in the scenario.
        Steven describes what he plans to do and asks whether his actions are legally acceptable.
        Jame should explain the relevant laws, highlight potential consequences, and give clear, practical advice.
        Make the dialogue natural, informative, and easy to follow, as if two people were speaking in real life.
        Scenario: {{scenario}}
